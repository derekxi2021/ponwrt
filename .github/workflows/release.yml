name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ponwrt-ccache-${{ matrix.target }}-${{ hashFiles('configs/*.config') }}
          restore-keys: |
            ponwrt-ccache-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Update geosite/geoip from Loyalsoldier
        run: |
          echo ">>> 开始处理 geosite / geoip 规则数据库..."
          TMP_GEO_DIR="/tmp/geo_rules_tmp"
          rm -rf "$TMP_GEO_DIR"
          mkdir -p "$TMP_GEO_DIR"
          echo ">>> 尝试下载 Loyalsoldier 最新规则..."
          curl -sSL --connect-timeout 15 -m 30 -o "$TMP_GEO_DIR/geoip.dat" https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -sSL --connect-timeout 15 -m 30 -o "$TMP_GEO_DIR/geosite.dat" https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          GEOIP_SIZE=$(stat -c%s "$TMP_GEO_DIR/geoip.dat" 2>/dev/null || echo 0)
          GEOSITE_SIZE=$(stat -c%s "$TMP_GEO_DIR/geosite.dat" 2>/dev/null || echo 0)
          if [ "$GEOIP_SIZE" -gt 1048576 ] && [ "$GEOSITE_SIZE" -gt 1048576 ]; then
              echo ">>> Loyalsoldier 最新规则拉取成功！开始注入..."
              mkdir -p files/usr/share/v2ray
              cp -f "$TMP_GEO_DIR/geoip.dat" files/usr/share/v2ray/
              cp -f "$TMP_GEO_DIR/geosite.dat" files/usr/share/v2ray/
              find feeds/ package/ -type f -name "Makefile" -exec grep -l "geodata" {} + 2>/dev/null | while read -r file; do
                  sed -i 's/$(INSTALL_DATA) .*geoip.dat/echo "Skip geoip.dat"/g' "$file" 2>/dev/null || true
                  sed -i 's/$(INSTALL_DATA) .*geosite.dat/echo "Skip geosite.dat"/g' "$file" 2>/dev/null || true
              done
              echo ">>> 规则替换与 Makefile 防覆盖处理完毕！"
          else
              echo ">>> [警告] 最新规则拉取失败或超时，保留源码自带规则！"
          fi
          rm -rf "$TMP_GEO_DIR"

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Setup ccache
        run: |
          mkdir -p /home/runner/.ccache
          ccache -M 5G
          ccache -z

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: make -j"$(nproc)"

      - name: Show ccache stats
        run: ccache -s || true

      - name: Collect itb images
        run: |
          mkdir -p release
          cp bin/targets/airoha/${{ matrix.target }}/*.itb release/
          ls -la release/

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.itb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.itb > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.itb
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
